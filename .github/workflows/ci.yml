name: Contract tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tested capture dependencies
        run: python -m pip install ".[capture]" build
      - name: Offline unit, integration and known-bad controls
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m unittest discover -s tests -v
      - name: Run original demo
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: chat-input-contract demo --out ci-demo
      - name: Build distributable artifacts
        run: python -m build
